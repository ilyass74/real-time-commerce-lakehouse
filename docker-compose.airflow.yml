x-airflow-common: &airflow-common
  build:
    context: ./airflow

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"

    PROJECT_ROOT: "C:/Users/HP/Documents/real-time-commerce-lakehouse"
    COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
    COMPOSE_NETWORK: "commerce-lakehouse_default"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs

    # Allows DockerOperator to launch Spark containers.
    - /var/run/docker.sock:/var/run/docker.sock

  depends_on:
    airflow-db:
      condition: service_healthy


services:

  airflow-db:
    image: postgres:15

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - airflow_db:/var/lib/postgresql/data


  airflow-init:
    <<: *airflow-common

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Commerce \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com || true

    restart: "no"


  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "8081:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10


  airflow-scheduler:
    <<: *airflow-common

    command: scheduler


volumes:
  airflow_db:
  airflow_logs:
